<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz review tests</title>
</head>
<body>
  <h1>Quiz review tests</h1>
  <pre id="result">Running...</pre>
  <iframe id="quiz" src="../index.html" title="Quiz under test" width="320" height="800"></iframe>
  <script>
    "use strict";
    document.getElementById("quiz").addEventListener("load", () => {
      const doc = document.getElementById("quiz").contentDocument;
      const result = document.getElementById("result");
      const correct = [1, 2, 3, 0, 2, 1, 3, 0, 2, 1];
      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }
      function play(wrongQuestions) {
        correct.forEach((answer, index) => {
          const chosen = wrongQuestions.includes(index) ? (answer + 1) % 4 : answer;
          const buttons = doc.querySelectorAll("#answers button");
          buttons[chosen].click();
          buttons[chosen].click();
          doc.getElementById("next").click();
        });
      }
      function restart() {
        doc.getElementById("restart").click();
        assert(doc.querySelectorAll("#review-list li").length === 0, "Restart must clear the old review");
        assert(doc.getElementById("score").textContent === "0", "Restart must clear the score");
        assert(doc.activeElement.id === "question", "Restart must focus the first question");
      }
      try {
        play([0, 9]);
        let entries = doc.querySelectorAll("#review-list li");
        assert(entries.length === 2, "Only missed questions should be listed once");
        const colorProbe = doc.createElement("span");
        colorProbe.style.color = "var(--bad)";
        colorProbe.style.backgroundColor = "var(--bad-bg)";
        doc.body.append(colorProbe);
        const badColor = doc.defaultView.getComputedStyle(colorProbe).color;
        const badBackground = doc.defaultView.getComputedStyle(colorProbe).backgroundColor;
        assert(doc.defaultView.getComputedStyle(entries[0].querySelector("h4")).color === badColor, "Missed question headings must be red");
        assert(doc.defaultView.getComputedStyle(entries[0]).backgroundColor === badBackground, "Missed question entries must have a red background");
        colorProbe.remove();
        assert(doc.getElementById("final-score").textContent === "8", "Mixed score must remain correct");
        assert(doc.getElementById("wrong-count").textContent === "2", "Mixed wrong count must remain correct");
        assert(doc.activeElement.id === "result-title", "Results must receive focus");
        assert(entries[0].querySelector("h4").textContent === "Which planet is known as the Red Planet?", "Review must include the question");
        assert(Array.from(entries[0].querySelectorAll("dd"), el => el.textContent).join("|") ===
          "Jupiter|Mars|Iron minerals in Mars's soil rust, giving the planet its distinctive reddish color.", "Review must include the chosen answer, correct answer, and fact");
        assert(entries[1].querySelector("h4").textContent === "Which spacecraft became the first to enter interstellar space?", "Review must retain quiz order");
        assert(doc.getElementById("perfect-review").hidden, "Mixed results must not show the perfect message");

        restart();
        play([]);
        assert(doc.getElementById("final-score").textContent === "10", "Perfect score must remain correct");
        assert(!doc.getElementById("perfect-review").hidden, "Perfect results must say there are no missed questions");
        assert(doc.querySelectorAll("#review-list li").length === 0, "Perfect results must not retain old misses");

        restart();
        play(correct.map((_, index) => index));
        entries = doc.querySelectorAll("#review-list li");
        assert(entries.length === 10, "All missed questions must be listed");
        assert(doc.getElementById("final-score").textContent === "0", "All-wrong score must remain correct");
        assert(doc.getElementById("wrong-count").textContent === "10", "All-wrong count must remain correct");
        assert(doc.getElementById("perfect-review").hidden, "All-wrong results must not show the perfect message");
        assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, "Review must fit a narrow screen");
        result.textContent = "PASS: mixed, perfect, restart, and all-wrong review";
      } catch (error) {
        result.textContent = `FAIL: ${error.message}`;
        throw error;
      }
    });
  </script>
</body>
</html>
